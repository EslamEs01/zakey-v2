name: Deploy ZAKEY frontend preview

on:
  push:
    branches:
      - main
      - 003-zakey-frontend-reference-build
      - 004-zakey-commerce-backend-admin
      - "004-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zakey
          POSTGRES_PASSWORD: zakey
          POSTGRES_DB: zakey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zakey -d zakey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://zakey:zakey@127.0.0.1:5432/zakey
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci
          npx playwright install --with-deps chrome

      - name: Build and verify frontend
        run: |
          npm run build
          npm run check:js
          uv run python manage.py test

      - name: Export static site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/003-zakey-frontend-reference-build'
        run: npm run export:pages

      - name: Verify exported Pages navigation and catalogue
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/003-zakey-frontend-reference-build'
        run: npm run test:pages

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/003-zakey-frontend-reference-build'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/003-zakey-frontend-reference-build'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  concurrency:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zakey
          POSTGRES_PASSWORD: zakey
          POSTGRES_DB: zakey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zakey -d zakey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://zakey:zakey@127.0.0.1:5432/zakey
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL concurrency suite
        run: uv run pytest -q tests/concurrency

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: zakey-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
