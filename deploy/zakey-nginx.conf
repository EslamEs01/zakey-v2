# Nginx site for ZAKEY (T-2001). NOT INSTALLED — reviewed example only.
#
# No TLS certificate has been issued, no DNS record created and no VPS accessed
# from this repository. `server_name` and certificate paths below are
# placeholders that must be replaced with the approved production hostname.
#
#   install: /etc/nginx/sites-available/zakey
#   enable:  ln -s ../sites-available/zakey /etc/nginx/sites-enabled/zakey
#   verify:  nginx -t

upstream zakey_app {
    # Matches deploy/gunicorn.conf.py. Loopback only.
    server 127.0.0.1:8001 fail_timeout=0;
}

# Plain HTTP exists only to redirect. Django also sets SECURE_SSL_REDIRECT, so
# the guarantee does not depend on this block alone.
server {
    listen 80;
    listen [::]:80;
    server_name ZAKEY_HOSTNAME_PLACEHOLDER;

    # Let the ACME challenge through; send everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/zakey-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ZAKEY_HOSTNAME_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/ZAKEY_HOSTNAME_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ZAKEY_HOSTNAME_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ZAKEY_SSL:10m;

    # HSTS is also set by Django; both layers assert it so neither is a single
    # point of failure.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A smart lock product page carries several images; 10M is ample for the
    # admin's own uploads and far below anything that threatens the disk.
    client_max_body_size 10M;
    keepalive_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Static files are served by Nginx, never by Django, in production.
    location /static/ {
        alias /srv/zakey/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media. `X-Content-Type-Options` above matters most here: uploads
    # are validated on the way in (T-1702), and must never be sniffed on the way
    # out.
    location /media/ {
        alias /srv/zakey/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        # An uploaded file is never executable content.
        location ~* \.(php|py|pl|cgi|sh)$ { return 404; }
    }

    # Health probe: available to the local monitor, not to the internet. It
    # reports database connectivity and nothing about configuration (FR-006).
    location = /healthz/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://zakey_app;
        access_log off;
    }

    location / {
        proxy_pass http://zakey_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER trusts exactly this header.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
