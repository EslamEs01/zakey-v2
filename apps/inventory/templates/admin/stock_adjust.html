{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p>سيتم تسجيل حركة مخزون لكل عنصر مع السبب والمنفّذ.</p>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  {% for item in items %}
    <input type="hidden" name="_selected_action" value="{{ item.pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="adjust_stock">
  <button type="submit" name="apply" class="default">تنفيذ التسوية</button>
</form>
{% endblock %}
