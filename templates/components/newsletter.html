<div class="newsletter-card">
  <p class="eyebrow">ابقَ على اطلاع</p>
  <h2 id="newsletter-heading">وصلك كل جديد من ZAKEY</h2>
  <p class="section-copy section-copy--light" style="margin-inline:auto">اعرض حالات الاشتراك في الواجهة فقط؛ لن يُرسل بريد أو تُحفظ بيانات.</p>
  <form class="newsletter-form" data-prototype-form="newsletter" novalidate>
    <div class="field" style="flex:1;text-align:start">
      <label class="sr-only" for="newsletter-email">البريد الإلكتروني</label>
      <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني" aria-describedby="newsletter-error newsletter-note" required>
      <p class="field-error" id="newsletter-error" hidden></p>
    </div>
    <button class="btn btn--gold" type="submit">اشترك</button>
  </form>
  <p class="prototype-note" id="newsletter-note">حالة واجهة تجريبية — لا يوجد إرسال فعلي.</p>
  <div data-form-status="newsletter" role="status" hidden></div>
</div>
